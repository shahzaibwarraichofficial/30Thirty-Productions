<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon | 30Thirty Productions</title>
<link rel="icon" type="image/png" href="logo.png">
    <style>
        .brand img {
    width: 180px;
    max-width: 80%;
    height: auto;
    display: block;
    margin: 0 auto 35px;
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        .coming-soon {
            width: 90%;
            max-width: 700px;
            padding: 50px 30px;
            border: 1px solid #333;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.12);
        }

        .brand {
            font-size: 18px;
            letter-spacing: 5px;
            color: #d4af37;
            margin-bottom: 35px;
            font-weight: bold;
        }

        h1 {
            font-size: 65px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        h1 span {
            color: #d4af37;
        }

        p {
            color: #bbb;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            background: #d4af37;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.3);
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 45px;
            }

            p {
                font-size: 16px;
            }

            .coming-soon {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="coming-soon">

        <div class="brand">
    <img src="logo.png" alt="30Thirty Productions Logo">
</div>

        <h1>
            Coming <span>Soon</span>
        </h1>

        <p>
            <p>
    We're working behind the scenes to bring you
    something amazing.
    <br>
    This 30Thirty channel will launch soon.
    <br>
    Stay connected with us.
</p>
        </p>

        <a href="index.html" class="btn">
            ← Back to Home
        </a>

    </div>

</body>
</html>
