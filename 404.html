<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | 30Thirty Productions</title>

    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .error-page {
            width: 90%;
            max-width: 650px;
            padding: 50px 25px;
        }

        img {
            width: 160px;
            max-width: 80%;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 90px;
            color: #d4af37;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 13px 25px;
            background: #d4af37;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="error-page">

        <img src="logo.png" alt="30Thirty Productions Logo">

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>
            The page you're looking for doesn't exist
            or may have been moved.
        </p>

        <a href="index.html" class="btn">
            ← Back to Home
        </a>

    </div>

</body>
</html>
